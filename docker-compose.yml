# docker compose up --build -d     starts everything; Jaeger UI on http://localhost:16686
#
# orders ──(outbox, worker-orders)──► payments ──(outbox, worker-payments)──► ledger
name: ledgerline

x-app: &app
  image: ledgerline:dev
  build:
    context: .
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/ledgerline", "health", "localhost:50051"]
    interval: 2s
    timeout: 3s
    retries: 30

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  # Head sampling, decided once per trace at its root and followed by every service (parent-
  # based). 1.0 traces every order (the default; the trace check needs it); production systems
  # usually trace a fraction, e.g. TRACE_SAMPLE=0.1 for 10%.
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "${TRACE_SAMPLE:-1.0}"

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - ./deploy/initdb.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.22.0 # all-in-one: OTLP receiver on 4317, UI and API on 16686
    ports:
      - "16686:16686"
      - "4317:4317"

  orders:
    <<: *app
    command: ["orders"]
    environment:
      <<: *otel
      DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/orders?sslmode=disable
    ports:
      - "50051:50051"
    depends_on:
      postgres: { condition: service_healthy }

  payments:
    <<: *app
    command: ["payments"]
    environment:
      <<: *otel
      DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/payments?sslmode=disable
      PROVIDER_LATENCY_MS: "${PROVIDER_LATENCY_MS:-0}"
      PROVIDER_FAIL_RATE: "${PROVIDER_FAIL_RATE:-0}"
      PROVIDER_LOST_REPLY_RATE: "${PROVIDER_LOST_REPLY_RATE:-0}"
    depends_on:
      postgres: { condition: service_healthy }

  ledger:
    <<: *app
    command: ["ledger"]
    environment:
      <<: *otel
      DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/ledger?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  worker-orders:
    <<: *app
    command: ["outbox-worker"]
    environment:
      <<: *otel
      SOURCE_DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/orders?sslmode=disable
      TARGET: payments
      TARGET_ADDR: payments:50051
    depends_on:
      orders: { condition: service_healthy }
      payments: { condition: service_healthy }

  worker-payments:
    <<: *app
    command: ["outbox-worker"]
    environment:
      <<: *otel
      SOURCE_DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/payments?sslmode=disable
      TARGET: ledger
      TARGET_ADDR: ledger:50051
    depends_on:
      payments: { condition: service_healthy }
      ledger: { condition: service_healthy }
